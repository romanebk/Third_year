services:
  db:
    image: postgis/postgis:16-3.4
    container_name: geoemploi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: geoemploi
      POSTGRES_PASSWORD: geoemploi
      POSTGRES_DB: geoemploi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoemploi -d geoemploi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
