<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>R-Type Kick-off — Good Luck</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .cover-mascot { width: auto; height: auto; }
        .ship { display: flex; align-items: center; gap: 0.4vw; }
        .cover-mascot img { image-rendering: pixelated; }
        .ship img:first-child { width: 12vw; }
        .ship img:last-child  { width: 6vw; }
        .cover-subtitle b { color: #fff; font-style: normal; }
    </style>
</head>
<body>
    <section class="slide slide-cover">
        <div class="logo-epitech" title="Click to export PDF">{EPITECH}</div>

        <div class="deco-block-1"></div>
        <div class="deco-block-2"></div>

        <div class="cover-content">
            <div class="cover-eyebrow">Epitech Afrique — R-Type</div>
            <h1 class="cover-title">
                Good Luck.<span class="cursor"></span>
            </h1>
            <p class="cover-subtitle">
                See you at the first defense: <b>the POC</b>.
            </p>
        </div>

        <div class="cover-mascot"><div class="ship">
            <img src="assets/player_cyan.png" alt="R-9 ship">
            <img src="assets/force.png" alt="Force orb">
        </div></div>
    </section>
</body>
</html>
