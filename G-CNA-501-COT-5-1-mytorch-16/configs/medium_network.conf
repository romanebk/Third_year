## my_torch
## File description:
## Configuration du réseau medium (3 classes, architecture plus grande).
## Dépend de : include/mytorch/NetworkConfig.hpp
##

## Taille de l'entrée : 64 cases x 12 pieces + trait + 4 roques.
input_size = 773

## Nombre de classes en sortie et libelles affiches en prediction.
num_classes = 3
label = Nothing
label = Check
label = Checkmate

## Taille des couches cachees.
hidden_sizes = 256 128 64

## Activation entre les couches cachees, initialisation des poids caches et de sortie.
hidden_activation = relu
hidden_init = he
output_init = xavier

## Hyperparametres d'entrainement, conserves dans le fichier .nn.
epochs = 150
batch_size = 128
learning_rate = 0.05
momentum = 0.9
l2 = 0.001
dropout = 0.0
seed = 42
